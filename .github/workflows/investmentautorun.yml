name: Auto Run Colab Notebook

on:
  # Trigger 1: Runs automatically when a file changes on the main branch
  push:
    branches:
      - main
  # Trigger 2: Runs automatically at a specific time (e.g., Every day at 8:00 AM UTC)
  schedule:
    - cron: '0 8 * * *'
  # Trigger 3: Adds a manual "Run" button on GitHub just in case
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      # 1. Download the code from your repository into the runner
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install necessary packages (Adjust this for libraries you use)
      - name: Install Dependencies
        run: |
          pip install jupyter nbconvert pandas numpy

      # 4. Execute the actual Notebook file in the background
      - name: Execute Notebook
        run: |
          jupyter nbconvert --to notebook --execute my_notebook.ipynb --output executed_notebook.ipynb

      # 5. Save the updated notebook back to GitHub with the new results
      - name: Commit and Push Updated Notebook
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add executed_notebook.ipynb
          git commit -m "Auto-run results updated" || echo "No changes to commit"
          git push
