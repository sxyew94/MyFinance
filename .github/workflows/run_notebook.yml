name: Run Investment Notebook

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger button in Actions tab

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install papermill jupyter pandas yfinance gspread

      - name: Execute Investment Notebook
        run: |
          papermill Investment.ipynb output_investment.ipynb

      - name: Commit Output Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_investment.ipynb
          git commit -m "Auto-executed notebook results" || exit 0
          git push
